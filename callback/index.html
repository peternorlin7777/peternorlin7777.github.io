<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTesla – åter till appen</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B0D10;
    color: #F3F5F7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: #9AA5B1; font-size: 15px; line-height: 1.5; }
  a {
    display: inline-block;
    margin: 20px 0 8px;
    padding: 14px 22px;
    border-radius: 14px;
    background: #E82127;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
  .hint { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Tillbaka till MyTesla</h1>
  <p id="status">Öppnar appen…</p>
  <a id="open" href="mytesla://callback">Öppna MyTesla</a>
  <p class="hint">
    Händer inget? Tryck på knappen ovan. Sidan lagrar ingenting – koden i adressen
    är engångs och byts mot ett token inuti appen.
  </p>
</main>
<script>
  (function () {
    var target = "mytesla://callback" + window.location.search;
    document.getElementById("open").href = target;
    window.setTimeout(function () {
      window.location.href = target;
    }, 50);
  })();
</script>
</body>
</html>
